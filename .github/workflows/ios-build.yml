name: iOS Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# 挂 ipa 到 Release 与回写 build-count.json 都需要写权限；
# 默认 GITHUB_TOKEN 是只读，之前 "gh release upload" 直接报 HTTP 403。
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest      # 用 GitHub 当前可用的 macOS runner；arm64-ios 交叉编译
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg：用官方仓库的 arm64-ios triplet 编 curl/openssl 静态库。
      # 不用 manifest baseline，classic 模式避免伪造 baseline 哈希。
      # 用 codeload 的 tar 包而不是 git clone：runner 上匿名 git clone 偶发
      # "could not read Username for 'https://github.com'"，tar 下载更稳。
      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vcpkg"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 \
                -o "$RUNNER_TEMP/vcpkg.tar.gz" \
                https://codeload.github.com/microsoft/vcpkg/tar.gz/refs/heads/master; then
              break
            fi
            echo "vcpkg 下载失败，第 $i 次重试..."
            sleep 10
          done
          tar xzf "$RUNNER_TEMP/vcpkg.tar.gz" -C "$RUNNER_TEMP/vcpkg" --strip-components=1
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Install curl + openssl for iOS
        run: |
          # 仓库根的 vcpkg.json 会让 vcpkg 进 manifest 模式（不接受包名参数），
          # 这里用 --classic 强制 classic 模式 + 显式 triplet。
          # overlay-triplets 把最低版本对齐工程部署目标(16.0)，避免 26.5 库链到 16.0。
          "$VCPKG_ROOT/vcpkg" install curl:arm64-ios openssl:arm64-ios --classic \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/triplets" --clean-after-build

      - name: Show vcpkg toolchain
        run: |
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          ls "$VCPKG_ROOT/installed/arm64-ios/lib" | head -20

      # 构建号 = 总编译次数，由 CI 算好直接注入 xcodebuild，
      # 包里的 CFBundleVersion、build-count.json、tag 的 .buildN 三者永远是同一个数。
      #   分支构建：号 = build + 1（并回写）
      #   tag 构建：号 = tag 名里的 .buildN（tag 是快照，不再累加）
      - name: Allocate build number
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            N="${TAG##*.build}"
            echo "tag 构建：从 $TAG 取号 $N"
          else
            N=$(python3 -c "import json;print(int(json.load(open('build-count.json'))['build'])+1)")
            echo "分支构建：build+1 = $N"
          fi
          case "$N" in ''|*[!0-9]*) echo "::error::构建号解析失败：$N"; exit 1;; esac
          echo "BUILD_NUMBER=$N" >> "$GITHUB_ENV"
          echo "本次构建号：$N" | tee -a "$GITHUB_STEP_SUMMARY"

      # 用 Ad-Hoc 签名（无开发者账号），生成的 ipa 可 sideload / TestFlight 之外安装。
      - name: Build & Archive (Ad-Hoc)
        env:
          VCPKG_INSTALLED: ${{ runner.temp }}/vcpkg/installed/arm64-ios
        run: |
          set -euo pipefail
          PROJ="$GITHUB_WORKSPACE/ios/ChatboxIOS.xcodeproj"
          OUT="$GITHUB_WORKSPACE/.build/ios"
          mkdir -p "$OUT"

          # pbxproj 里已用 $(VCPKG_INSTALLED)/include 与 /lib，
          # 这里只需把环境变量传进来；Foundation/UIKit 由 Xcode 自动链接。
          xcodebuild -project "$PROJ" \
            -scheme ChatboxIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$OUT/ChatboxIOS.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$OUT/archive.log"

      # archive 是未签名的（CODE_SIGNING_ALLOWED=NO）。
      # -exportArchive 需要开发者 Team，这里改为手动组 ipa + ad-hoc 签名（codesign -s -）。
      - name: Package .ipa (ad-hoc)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.build/ios"
          APP="$OUT/ChatboxIOS.xcarchive/Products/Applications/ChatboxIOS.app"
          test -d "$APP" || { echo "::error::找不到 ChatboxIOS.app"; exit 1; }

          # ad-hoc 签名：无需证书 / Team，装上需 sideload 工具重签
          codesign --force --deep --sign - --timestamp=none "$APP" || \
            echo "::warning::ad-hoc 签名失败，产物为未签名 ipa"

          rm -rf "$OUT/ipa" && mkdir -p "$OUT/ipa/Payload"
          cp -R "$APP" "$OUT/ipa/Payload/"
          ( cd "$OUT/ipa" && zip -qry "ChatboxIOS-adhoc.ipa" Payload )
          ls -la "$OUT/ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatboxIOS-adhoc
          path: .build/ios/ipa/*.ipa
          if-no-files-found: error

      # 「编译一次算一次构建」：云编译也计数，成功失败都记。
      # 分支构建：号已在 Allocate 算好（build+1），这里落盘并回写仓库。
      # tag 构建：号由 tag 名决定，只展示不回写（tag 是快照，不推进计数器）。
      - name: Record build count
        if: always()
        env:
          RESULT: ${{ job.status == 'success' && 'success' || 'failed' }}
        run: |
          set -uo pipefail
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "tag 构建：build $BUILD_NUMBER，不推进计数器" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 scripts/bump-build.py --show | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/bump-build.py --source ci --ref "$GITHUB_RUN_ID" \
            --result "$RESULT" --note "云编译 $GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/bump-build.py --show | tee -a "$GITHUB_STEP_SUMMARY"

          [ "$GITHUB_REF" = "refs/heads/master" ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-count.json
          git diff --cached --quiet && exit 0
          N=$(python3 -c "import json;print(json.load(open('build-count.json'))['build'])")
          git commit -q -m "chore(build): 第 ${N} 次编译 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin master && git push -q origin master && break || sleep 3
          done

      # tag 推送时，把 ipa 挂到同名 Release。Release 不存在就现建，
      # 这样推 tag 一步到位，不用先在网页上手动创建（之前只 upload 会 403/找不到 Release）。
      - name: Attach ipa to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          for ipa in .build/ios/ipa/*.ipa; do
            gh release upload "$TAG" "$ipa" --clobber
          done
